<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">

<style>
  .hero {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .hero-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right, rgba(5,5,5,0.75) 0%, rgba(5,5,5,0.05) 40%, rgba(5,5,5,0.05) 60%, rgba(5,5,5,0.75) 100%),
      linear-gradient(to bottom, rgba(5,5,5,0.4) 0%, transparent 30%, transparent 70%, rgba(5,5,5,0.6) 100%);
  }

  .hero-content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 100svh;
    padding: 2rem;
  }

  .hero-top {
    display: flex;
    justify-content: center;
    padding-top: 5rem;
    animation: fadeUp 1.4s ease both;
  }

  .location-tag {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: clamp(0.6rem, 1.1vw, 0.75rem);
    letter-spacing: 0.35em;
    color: #e8d5b0;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(201,169,110,0.4);
    padding-bottom: 0.4rem;
  }

  .hero-middle {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .title-left {
    align-self: flex-start;
    padding-left: clamp(1rem, 5vw, 8rem);
    animation: fadeRight 1.6s ease both 0.3s;
  }

  .title-right {
    align-self: flex-end;
    padding-right: clamp(1rem, 5vw, 8rem);
    text-align: right;
    animation: fadeLeft 1.6s ease both 0.5s;
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(3.5rem, 10vw, 10rem);
    line-height: 0.92;
    color: #fff;
    letter-spacing: -0.01em;
  }

  .hero-title em {
    font-style: normal;
    color: #c9a96e;
    font-weight: 400;
  }

  .hero-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: clamp(2rem, 5vh, 4rem);
    gap: 2rem;
  }

  .desc-left {
    max-width: 28ch;
    padding-left: clamp(1rem, 5vw, 8rem);
    animation: fadeUp 1.8s ease both 0.7s;
  }

  .desc-text {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1rem, 1.6vw, 1.25rem);
    line-height: 1.7;
    color: rgba(245,239,230,0.85);
  }

  .desc-text span {
    display: block;
    width: 2rem;
    height: 1px;
    background: #c9a96e;
    margin-bottom: 1rem;
  }

  .cta-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1rem;
    padding-right: clamp(1rem, 5vw, 8rem);
    animation: fadeUp 1.8s ease both 0.9s;
  }

  .cta-primary {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: clamp(0.75rem, 1.2vw, 0.9rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #0a0a0a;
    background: #c9a96e;
    padding: 1rem 2.4rem;
    text-decoration: none;
    border-radius: 100px;
    transition: background 0.3s;
  }
  .cta-primary:hover { background: #e8d5b0; }

  .cta-secondary {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: clamp(0.7rem, 1vw, 0.82rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #e8d5b0;
    text-decoration: none;
    border-bottom: 1px solid rgba(201,169,110,0.4);
    padding-bottom: 0.2rem;
    transition: color 0.3s, border-color 0.3s;
  }
  .cta-secondary:hover { color: #fff; border-color: #fff; }

  .scroll-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    animation: fadeIn 2.4s ease both 1.4s;
  }
  .scroll-hint p {
    font-family: 'Raleway', sans-serif;
    font-size: 0.55rem;
    letter-spacing: 0.3em;
    color: rgba(201,169,110,0.6);
    text-transform: uppercase;
  }
  .scroll-line {
    width: 1px;
    height: 3rem;
    background: linear-gradient(to bottom, rgba(201,169,110,0.6), transparent);
    animation: scrollDrop 2s ease-in-out infinite 1.4s;
  }

  @keyframes fadeUp    { from { opacity:0; transform:translateY(30px) }  to { opacity:1; transform:translateY(0) } }
  @keyframes fadeRight { from { opacity:0; transform:translateX(-40px) } to { opacity:1; transform:translateX(0) } }
  @keyframes fadeLeft  { from { opacity:0; transform:translateX(40px) }  to { opacity:1; transform:translateX(0) } }
  @keyframes fadeIn    { from { opacity:0 } to { opacity:1 } }
  @keyframes scrollDrop {
    0%, 100% { opacity:0.5; }
    50%       { opacity:1; }
  }

  @media (max-width: 640px) {
    .hero-bottom { flex-direction: column; align-items: flex-start; padding-bottom: 6rem; }
    .cta-right { align-items: flex-start; padding-left: clamp(1rem, 5vw, 3rem); padding-right: 0; }
  }
</style>

<section class="hero pt-20">

  <video class="hero-video" autoplay muted loop playsinline poster="vista tenuta.jpeg">
    <source src="Videoindietrotenuta.MP4" type="video/mp4">
  </video>

  <div class="hero-overlay"></div>

  <div class="hero-content">

    <div class="hero-top">
      <p class="location-tag">Sant'Eusanio del Sangro &nbsp;·&nbsp; Abruzzo</p>
    </div>

    <div class="hero-middle">
      <div class="title-left">
        <h1 class="hero-title">Dormire<br>tra le <em>stelle</em></h1>
      </div>
      <div class="title-right">
        <h1 class="hero-title">e il <em>grano</em><br>dorato</h1>
      </div>
    </div>

    <div class="hero-bottom">
      <div class="desc-left">
        <p class="desc-text">
          <span></span>
          Bolle di cristallo sospese<br>
          tra la Maiella e il profumo del mare.<br>
          Una notte, un'emozione,<br>
          un ricordo per sempre.
        </p>
      </div>
      <div class="cta-right">
        <a href="stanze.html" class="cta-primary">Scopri le Bolle</a>
        <a href="tenuta.html" class="cta-secondary">Prenota la tua fuga</a>
      </div>
    </div>

  </div>

  <div class="scroll-hint">
    <div class="scroll-line"></div>
    <p>Scorri</p>
  </div>

</section>
